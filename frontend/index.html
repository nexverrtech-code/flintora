<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#040404" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/konexy.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/sora-light.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Decide before first paint whether the Spark Awakening intro will play, so the page
      // underneath never flashes. Plays on every load or reload of the home page (not on
      // in-site navigation), never with reduced motion. A CSS fail-safe removes the cover
      // even if JavaScript stalls.
      (function () {
        try {
          var d = document.documentElement;
          d.classList.add('js');
          var home = location.pathname === '/' || location.pathname === '/index.html';
          var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (home && !reduce) d.classList.add('intro-pending');
        } catch (e) {}
      })();
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="intro-cover" aria-hidden="true"></div>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
